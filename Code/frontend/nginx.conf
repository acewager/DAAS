# Production SPA config (M10): static assets with history-mode fallback.
# /api/ is routed to the backend by Traefik (the backend-app router), so
# nginx only serves the SPA.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the entrypoint; hash-named assets cache hard.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
